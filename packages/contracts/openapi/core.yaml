openapi: 3.1.0
info:
  title: Template Core Contracts
  version: 0.1.0
  description: |
    Contratos canónicos para Gateway y clientes. Base genérica y reusable.
servers:
  - url: https://api.template.local
    description: Gateway/BFF
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
      required: [status, service]
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required: [error, message]
    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required: [id, name, status]
paths:
  /health:
    get:
      summary: Health del gateway
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      summary: Login (IAM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required: [username, password]
      responses:
        '200':
          description: Tokens emitidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                required: [accessToken, refreshToken, expiresIn]
  /resources:
    get:
      summary: Lista recursos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      summary: Crear recurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
security:
  - bearerAuth: []
